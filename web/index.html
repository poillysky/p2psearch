<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14181f" />
  <meta name="color-scheme" content="dark" />
  <title>P2P Search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314181f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232fad9a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="page-search">
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topnav">
    <a class="brand-mark" href="/" aria-label="P2P Search 首页">
      <span class="brand-signal" id="brandSignal"></span>
      <span class="brand-word">P2P Search</span>
    </a>
    <nav class="topnav-nav" aria-label="主导航">
      <a class="nav-link active" href="/" aria-current="page">搜索</a>
      <a class="nav-link" href="/settings">设置</a>
    </nav>
  </header>

  <main class="compose">
    <div class="status compose-status" id="status" aria-live="polite">
      <span class="stat"><span class="dot" id="readyDot"></span><span id="readyText">检测中…</span></span>
      <span class="stat">KAD <strong id="dhtNodes">-</strong></span>
      <span class="stat">服务器 <strong id="serverCount">-</strong></span>
    </div>
    <section class="hero-search">
      <h1 class="brand-hero">P2P Search</h1>
      <p class="lede">在 ED2K 与 KAD 里找冷门源，复制链接，直达离线。</p>

      <form class="search" id="form" role="search">
        <div class="search-shell">
          <label class="visually-hidden" for="q">搜索关键词</label>
          <input type="search" id="q" name="q" placeholder="请输入关键词" required autofocus autocomplete="off" enterkeyhint="search" />
          <button type="submit" id="btn">搜索</button>
        </div>
      </form>
    </section>

    <section class="results-panel" aria-live="polite" aria-busy="false" id="resultsPanel">
      <div class="results-toolbar" id="resultsToolbar" hidden>
        <p class="results-count" id="resultsCount"></p>
        <div class="results-filters" id="resultsFilters">
          <label class="filter-field">
            <span class="visually-hidden">类型</span>
            <select id="filterType" aria-label="类型过滤">
              <option value="all">全部类型</option>
              <option value="video">视频</option>
              <option value="archive">压缩包</option>
              <option value="doc">文档</option>
            </select>
          </label>
          <label class="filter-field">
            <span class="visually-hidden">最小源数</span>
            <select id="filterMinSources" aria-label="最小源数">
              <option value="0">源数不限</option>
              <option value="1">≥ 1 源</option>
              <option value="3">≥ 3 源</option>
              <option value="5">≥ 5 源</option>
              <option value="10">≥ 10 源</option>
            </select>
          </label>
        </div>
        <nav class="pager" id="pager" aria-label="结果分页"></nav>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col" class="col-name">文件名</th>
              <th scope="col" class="col-num">大小</th>
              <th scope="col" class="col-num">源数</th>
              <th scope="col" class="col-source">来源</th>
              <th scope="col" class="col-action">操作</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="5" class="empty-cell">
                <div class="empty-state">
                  <strong>还没有结果</strong>
                  <span>输入关键词后，会在已连接的 eD2K 服务器与 KAD 中查询。</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog class="alert-dialog" id="offlineDialog" aria-labelledby="offlineDialogTitle">
    <div class="alert-dialog-body">
      <h2 id="offlineDialogTitle">转存结果</h2>
      <p id="offlineDialogMsg"></p>
    </div>
    <div class="alert-dialog-foot">
      <button type="button" id="offlineDialogOk">知道了</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
